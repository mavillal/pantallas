name: Compilar APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Falta el secreto KEYSTORE_B64: se firmará con clave de prueba y las actualizaciones exigirán desinstalar."
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pantallas.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/pantallas.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          PLAYER_URL: ${{ vars.PLAYER_URL }}
        run: gradle assembleRelease --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk pantallas-player.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pantallas Player v1.0.${{ github.run_number }}
          files: pantallas-player.apk
          make_latest: true
