plugins {
    id 'com.android.application'
}

// Valores que entrega GitHub Actions (secretos y variables del repo).
// VERSION_CODE = cantidad de commits del repo (siempre crece; ver .github/workflows/apk.yml).
def versionNum = (System.getenv('VERSION_CODE') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def playerUrl = System.getenv('PLAYER_URL') ?: 'https://mavillal.github.io/pantallas/'
def apiUrl = System.getenv('API_URL') ?: 'https://script.google.com/macros/s/AKfycbxbUWcwKkebleaZLdKZlF-WZJl-lDQyQAGBToPl9vIWZ8BXRY4I9jN9dNuypl0V_lu-/exec'
def keystorePath = System.getenv('KEYSTORE_PATH')
def keystorePass = System.getenv('KEYSTORE_PASS')

android {
    namespace 'cl.sadm.pantallas'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.sadm.pantallas'
        minSdk 24
        targetSdk 34
        versionCode versionNum
        versionName "1.0.${versionNum}"
        buildConfigField 'String', 'PLAYER_URL', "\"${playerUrl}\""
        buildConfigField 'String', 'API_URL', "\"${apiUrl}\""
        buildConfigField 'int', 'NUM_TORRES', '11'   // solo si no hay internet al configurar
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePass
                keyAlias 'pantallas'
                keyPassword keystorePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
